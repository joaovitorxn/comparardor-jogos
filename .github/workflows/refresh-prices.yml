# Atualização manual dos preços (botão "Run workflow" na aba Actions), chamando /api/cron/refresh.
# O agendamento de hora em hora é feito pelo cron-job.org (o agendador do GitHub atrasava e pulava execuções).
# Configure em Settings → Secrets and variables → Actions:
#   SITE_URL     ex.: https://dropou.com.br (sem barra no fim)
#   CRON_SECRET  o mesmo valor configurado na hospedagem
name: Atualizar preços

on:
  workflow_dispatch: # só roda na mão pela aba Actions

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar a rota de atualização
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure os secrets SITE_URL e CRON_SECRET no repositório."
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/refresh?wait=1")
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::A atualização respondeu HTTP $status"
            exit 1
          fi
